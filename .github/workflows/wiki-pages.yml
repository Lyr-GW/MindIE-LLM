# MindIE-LLM Wiki — 部署 + PR 在线预览
#
# 部署架构：
#   主站：    https://<owner>.github.io/<repo>/
#   PR 预览： https://<owner>.github.io/<repo>/pr-preview/pr-<N>/
#
# 主站源 = gh-pages 分支根目录；PR 预览 = gh-pages/pr-preview/pr-<N>/
# 主站部署不会覆盖 PR 预览（clean-exclude: pr-preview）
#
# ─────────────────────────────────────────────────────────────────────
# 启用方式（仓库管理员一次性设置）：
#   1) 开启此 workflow（首次合入即可）
#   2) Settings → Pages → Source 选择 "Deploy from a branch"
#      Branch: gh-pages  /  (root)
#      （注意：与之前的 "GitHub Actions" 模式相比要切换一次。
#        gh-pages 分支由 workflow 自动创建，不需要手工 push。）
# ─────────────────────────────────────────────────────────────────────
#
# 触发条件：
#   1) push 到 dev   ─ build → deploy 主站
#   2) PR  → dev 打开 / 同步        ─ build → deploy 预览到 pr-preview/pr-<N>/
#                                     完成后 rossjrw 自动在 PR 上评论预览 URL
#   3) PR  → dev 关闭 / 合入        ─ 自动删除该 PR 的预览目录

name: Wiki

on:
  push:
    branches: [dev]
    paths:
      - 'wiki/_build/**'
      - 'wiki/assets/**'
      - 'wiki/.nojekyll'
      - '.github/workflows/wiki-pages.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'wiki/_build/**'
      - 'wiki/assets/**'
      - 'wiki/.nojekyll'
      - '.github/workflows/wiki-pages.yml'

permissions:
  contents: write          # 写 gh-pages 分支
  pull-requests: write     # 在 PR 上评论预览 URL

# 同 PR / 同分支只保留最近一次 run
concurrency:
  group: wiki-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate site
    # PR closed 时跳过 build，跳到 cleanup 任务
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate HTML from content fragments
        working-directory: wiki
        run: |
          find . -maxdepth 1 -type f -name '*.html' -delete
          rm -rf features
          python3 _build/gen.py
          # 从产物中剔除生成器、源、本地辅助文件，让 gh-pages 树干净
          rm -rf _build .gitignore
          echo '--- generated ---'
          ls *.html | wc -l
          ls features/*.html | wc -l

      - name: Sanity check (no broken internal links)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('wiki')
          ok = True
          total = 0
          for p in sorted(root.glob('**/*.html')):
              total += 1
              txt = p.read_text(encoding='utf-8')
              for m in re.findall(r'href="([^"]+\.html)(?:#[^"]*)?"', txt):
                  if m.startswith('http') or m.startswith('#'):
                      continue
                  target = (p.parent / m).resolve()
                  if not target.exists():
                      print(f'[404] {p} -> {m}')
                      ok = False
          print(f'checked {total} pages')
          sys.exit(0 if ok else 1)
          PY

      - name: Upload generated site
        uses: actions/upload-artifact@v4
        with:
          name: wiki-site
          path: wiki
          retention-days: 1
          if-no-files-found: error

  deploy-main:
    name: Deploy main site
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # JamesIves 需要一个 git 工作目录才能初始化部署
      - name: Checkout (for git context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: wiki-site
          path: site

      - name: Verify .nojekyll present (block GitHub auto-Jekyll)
        run: |
          if [ ! -f site/.nojekyll ]; then
            echo "::warning::.nojekyll missing, creating one"
            touch site/.nojekyll
          fi

      - name: Deploy to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          # 主站部署时保留 pr-preview/* 不被清空；docs/ src/ 等会被自动清理
          clean-exclude: pr-preview
          commit-message: 'deploy(wiki): main from ${{ github.sha }}'

  deploy-preview:
    name: Deploy PR preview
    needs: build
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # rossjrw 内部使用 JamesIves，同样需要 git 工作目录
      - name: Checkout (for git context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: wiki-site
          path: site

      - name: Deploy preview to pr-preview/pr-<N>/
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy

  cleanup-preview:
    name: Remove PR preview
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for git context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove preview directory
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove

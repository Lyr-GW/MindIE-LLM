# MindIE-LLM Wiki — 部署到 GitHub Pages
#
# 流程：在 CI 期间用 wiki/_build/gen.py 从内容片段生成完整 HTML，再发布到 GitHub Pages。
# 站点 URL: https://<owner>.github.io/<repo>/
#
# 启用方式（仓库管理员只需做一次）：
#   Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
#
# 触发条件：
#   1) push 到 dev   ─ build + deploy（线上更新）
#   2) PR  → dev    ─ 仅 build（构建预览，不部署）
#                     PR 跑出来的 artifact 可在 Actions 页面下载离线预览
#   3) 手动触发      ─ build + deploy
#                     可在 Actions 页面选择任意分支（含 PR feature 分支）
#                     立刻把该分支内容部署到线上 URL，便于在线预览
#                     ⚠ 注意：会临时覆盖线上版本，直到下次合入 dev 才恢复

name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'wiki/_build/**'
      - 'wiki/assets/**'
      - 'wiki/.nojekyll'
      - '.github/workflows/wiki-pages.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'wiki/_build/**'
      - 'wiki/assets/**'
      - 'wiki/.nojekyll'
      - '.github/workflows/wiki-pages.yml'
  workflow_dispatch:

# Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署进行；新部署排队，旧的（非进行中）取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate HTML from content fragments
        working-directory: wiki
        run: |
          # 清理可能残留的渲染产物（保险）
          find . -maxdepth 1 -type f -name '*.html' -delete
          rm -rf features
          # 用 _build/pages/ 中的内容源 + 模板生成全部页面
          python3 _build/gen.py
          echo '--- generated files ---'
          ls *.html
          ls features/*.html | head -5
          echo "total: $(ls *.html features/*.html | wc -l) html files"

      - name: Sanity check (no broken internal links)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('wiki')
          ok = True
          total = 0
          for p in sorted(root.glob('**/*.html')):
              if '_build' in p.parts:
                  continue
              total += 1
              txt = p.read_text(encoding='utf-8')
              for m in re.findall(r'href="([^"]+\.html)(?:#[^"]*)?"', txt):
                  if m.startswith('http') or m.startswith('#'):
                      continue
                  target = (p.parent / m).resolve()
                  if not target.exists():
                      print(f'[404] {p} -> {m}')
                      ok = False
          print(f'checked {total} pages')
          sys.exit(0 if ok else 1)
          PY

      - name: Strip generator + sources from artifact
        # _build/ 仅是源码片段 + 生成器，不需要发到 Pages
        run: rm -rf wiki/_build

      - name: Upload artifact (wiki/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wiki

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # PR 触发时只 build 不 deploy；push 到 dev 与手动 dispatch 才走部署
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

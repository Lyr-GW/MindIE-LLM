# MindIE-LLM Wiki — 部署到 GitHub Pages
#
# 把仓库里的 wiki/ 目录作为站点根目录发布到 GitHub Pages。
# 站点 URL: https://<owner>.github.io/<repo>/
#
# 启用方式（仓库管理员只需做一次）：
#   Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
#
# 触发条件：
#   1) push 到 master 且 wiki/ 或本工作流文件有改动
#   2) 手动触发（workflow_dispatch）

name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-pages.yml'
  workflow_dispatch:

# Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署进行；新部署排队，旧的（非进行中）取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sanity check (no broken internal links)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('wiki')
          ok = True
          total = 0
          for p in sorted(root.glob('**/*.html')):
              if '_build' in p.parts:
                  continue
              total += 1
              txt = p.read_text(encoding='utf-8')
              for m in re.findall(r'href="([^"]+\.html)(?:#[^"]*)?"', txt):
                  if m.startswith('http') or m.startswith('#'):
                      continue
                  target = (p.parent / m).resolve()
                  if not target.exists():
                      print(f'[404] {p} -> {m}')
                      ok = False
          print(f'checked {total} pages')
          sys.exit(0 if ok else 1)
          PY

      - name: Upload artifact (wiki/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wiki

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
